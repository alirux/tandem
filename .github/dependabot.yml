# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # The three Spring Boot BOM pins in gradle/libs.versions.toml (spring-boot, spring-boot-v3-latest,
      # spring-boot-v4) are deliberate compatibility-contract decisions (LLD-spring-config §1.2), not
      # routine dependency bumps — each one is either the declared minimum supported Boot version or one
      # end of the dual/three-line test matrix. Dependabot matches "ignore" by Maven coordinate, not by
      # version-catalog key, so a rule here would apply identically to all three catalog entries — there
      # is no way to let it auto-bump the two "latest" trackers while leaving the frozen baseline alone.
      # Bumping any of the three stays a deliberate, manual change with the doc updates that go with it
      # (AGENTS.md "Releases"/commit-message conventions).
      - dependency-name: "org.springframework.boot:spring-boot-dependencies"
      # A major bump is, by definition, allowed to break — a coordinate rename (like
      # org.testcontainers:postgresql -> org.testcontainers:testcontainers-postgresql in Testcontainers
      # 2.0), a removed API, a raised toolchain floor. Auto-proposing it as a routine PR invites either a
      # broken build (the PR sits red) or an accidental merge of a change nobody actually reviewed as a
      # migration. Every dependency keeps getting patch/minor bumps automatically; a major bump stays a
      # deliberate, hand-driven upgrade with its own migration and test pass, same discipline as the
      # Spring Boot line above.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
